<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
    <section>
        <div class="infos">
            <div class="info">
                <h3>High Score</h3>
                <p id="high-score">0</p>
            </div>
            <div class="info">
                <h3>Score</h3>
                <p id="score">0</p>
            </div>
            <div class="info">
                <h3>Time</h3>
                <p id="time">00-00</p>
            </div>
        </div>
        <div class="board"></div>
    </section>
    <div class="modal">
        <div class="start-game">
            <h3>Start Game</h3>
            <button class="btn btn-start">Start</button>
        </div>
        <div class="game-over">
            <h3>Game Over</h3>
            <button class="btn btn-restart">Restart Game</button>
        </div>
    </div>

</main>

<script src="script.js"></script>
</body>
</html>
